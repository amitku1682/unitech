    <path d="M 104,110 C 90,110 74,98 64,80 C 50,56 50,34 68,18 C 86,2 120,2 144,14 C 166,26 178,44 174,68 C 172,74 168,76 164,74 C 160,70 162,64 164,56 C 166,40 156,26 138,16 C 118,6 88,6 74,20 C 60,34 60,52 72,72 C 80,86 92,96 104,96 C 108,96 110,102 108,106 C 107,109 106,110 104,110 Z" />

