<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" style="overflow: visible;">
  <!-- 1. The Dual-Arc Crescent Emblem -->
  <g fill="#dc2626">
    <!-- Outer Crescent Arch -->
    <path d="M 38,78 C 36,36 68,14 120,14 C 172,14 204,36 202,78 C 192,45 162,28 120,28 C 78,28 48,45 38,78 Z" />
    
    <!-- Inner Concentric Crescent Arch -->
    <path d="M 64,78 C 63,50 86,38 120,38 C 154,38 177,50 176,78 C 168,57 148,48 120,48 C 92,48 72,57 64,78 Z" />
  </g>

  <!-- 2. Brand Name: UNiTECH TM -->
  <g fill="#0a0a0a" text-anchor="middle">
    <text x="120" y="126" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5px">
      UN<tspan font-size="30px" font-weight="900">i</tspan>TECH<tspan font-size="13px" font-weight="700" dy="-14" dx="2">TM</tspan>
    </text>
  </g>

  <!-- 3. Official Tagline: "In Safe Hands" -->
  <g fill="#dc2626" text-anchor="middle">
    <text x="120" y="156" font-family="'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="17" letter-spacing="0.3px">
      “In Safe Hands”
    </text>
  </g>
</svg>