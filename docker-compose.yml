services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  unitech-db:
    image: postgres:16-alpine
    container_name: unitech-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unitech_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-unitech_cctv_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unitech_admin} -d ${POSTGRES_DB:-unitech_cctv_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Next.js Unified Application Container
  # ==========================================
  unitech-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unitech-staging-web
    restart: always
    depends_on:
      unitech-db:
        condition: service_healthy
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
